<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Modern CV - Template 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <style>
        @page { size: A4; }
        @media print {
            html {
                height: 297mm;
            }
            .section::before {
                display: block;
                content: "";
                margin-top: -297mm;
                height: 297mm;
                visibility: hidden;
            }
        }
        body {
            font-family: 'Old Standard TT', serif;
            margin: 10mm auto;
            width: 210mm;
            color: #000;
        }
        .cv-container {
            width: 100%;
            min-height: 29.7cm;
            max-width: 100%;
            margin: 1rem auto;
            background-color: #fff;
            padding: 1.5rem;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            position: relative;
        //padding-bottom: 60px;
        }

        #rodo-section-container {
            position: absolute;
            bottom: 1.5rem;
            left: 1.5rem;
            right: 1.5rem;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        input, textarea, div[contenteditable="true"] {
            font-family: 'Old Standard TT', serif;
        }
        h1 {
            margin-top: 0;
            text-align: center;
            margin-bottom: 1px;
        }
        .contact-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 1px;
            animation: fadeIn 1s ease;
        }
        .contact-fields {
            border-bottom: 2px solid #730D3F;
            display: flex;
            flex-wrap: nowrap;
            gap: 4px;
            justify-content: center;
            align-items: center;
            margin-bottom: 2px;
            font-size: 0.85rem;
            color: #444;
            margin-top: 1px;
            box-shadow: none;
            width: 100%;
            padding-bottom: 5px;
        }
        .contact-field {
            display: flex;
            align-items: center;
            gap: 6px;
            animation: fadeIn 0.5s ease;
            padding-top: 1px;
            box-shadow: none;
        }
        .contact-field input[type="text"],
        .contact-field input[type="email"] {
            font-size : 12px;
            border: none;
            background-color: transparent;
            box-shadow: none;
            overflow-x: auto;
            white-space: nowrap;
        }
        .contact-field input {
            border: none;
            outline: none;
            box-shadow: none;
        }
        .contact-options {
            background: #f2f2f2;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: center;
            animation: fadeIn 1s ease;
            box-shadow: none;
        }
        .contact-options h2 {
            font-size: 1rem;
            margin-bottom: 1px;
            color: #666;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .contact-btn {
            background-color: #ddd;
            color: #333;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }
        .contact-btn:hover {
            background-color: #ccc;
            transform: translateY(-2px);
        }
        .done-btn {
            background-color: #730D3F;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }
        .done-btn:hover {
            background-color: #730D3F;
            transform: translateY(-2px);
        }
        input[type="text"], input[type="email"] {
            font-size: 0.8rem;
            padding: 5px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 170px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }
        .contact-info {
            clear: both;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            margin-bottom: 1.2rem;
            font-size: 0.40rem;
        }

        .contact-info-icon, .contact-info-divider {
            font-size: 0.95rem;
        }

        .contact-info input {
            border: none;
            border-bottom: 1px solid #ccc;
            outline: none;
            font-size: 0.5rem;
            padding: 0 4px;
        }
        .bullet-list { list-style: disc; margin-left: 2rem; }
        .column-layout { display: flex; gap: 3rem; }
        .left, .right { flex: 1; }
        .strengths span, .languages span {
            display: inline-block;
            background-color: #ddd;
            padding: 0.25rem 0.5rem;
            margin: 0.25rem;
            border-radius: 5px;
        }
        .contact input {
            border: none;
            border-bottom: 1px solid #ccc;
            background: transparent;
            margin: 0 5px;
        }
        .section {
            margin-top: 0;
            margin-bottom: 0;
        }
        .section h2 {
            margin-bottom: 1px;
            color: #730D3F;
            font-size: 20px;
        }
        input, textarea {
            margin-bottom: 0.1px;
            border: none;
            border-bottom: 1px solid #ccc;
            padding: 0px;
            font-size: 1em;
            font-family: inherit;
            background: transparent;
        }
        .skills input {
            display: inline-block;
            background: #eee;
            margin: 5px 8px 0 0;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .add-button, .delete-button {
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
        .delete-button {
            color: red;
            font-size: 18px;
        }
        .dynamic-entry {
            margin-bottom: 10px;
        }
        ul {
            padding-left: 1.3rem;
            margin: 0;
        }

        li {
            margin-bottom: 0;
        }

        .custom-li {
            position: relative;
            list-style-type: none;
        }

        .custom-li::before {
            content: "⋅";
            position: absolute;
            top: 0;
            left: -15px;
            font-size: 20px;
        }
        .generate-pdf-btn {
            background-color: #730D3F;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }
        .generate-pdf-btn:hover {
            background-color: #730D3F;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<div class="cv-container" id="main-container">
    <h1><input id="name" type="text" placeholder="Your Full Name" style="font-size:40px;width:80%;border:none;text-align: center;color:#730D3F;"/></h1>
    <div class="contact-wrapper">
        <div id="contact-fields" class="contact-fields"></div>
        <div id="contact-options" class="contact-options">
            <h2>Select Your Contact Information</h2>
            <div class="buttons">
                <button onclick="addContactField('email')" class="contact-btn" id="email-btn">Email</button>
                <button onclick="addContactField('phone')" class="contact-btn" id="phone-btn">Phone</button>
                <button onclick="addContactField('address')" class="contact-btn" id="address-btn">Address</button>
                <button onclick="addContactField('linkedin')" class="contact-btn" id="linkedin-btn">LinkedIn</button>
                <button onclick="addContactField('github')" class="contact-btn" id="github-btn">GitHub</button>
            </div>
            <button onclick="finalizeContactFields()" class="done-btn">Done</button>
        </div>
    </div>


    <div class="section">
        <h2>Education
            <span class="add-button" onclick="addEducation()">➕</span>
            <span class="delete-button" onclick="removeLast('education-list')">🗑</span>
        </h2>
        <div id="education-list"></div>
    </div>

    <div class="section">
        <h2>Skills
            <span class="add-button" onclick="addSkill()">➕</span>
            <span class="delete-button" onclick="removeLast('skills-list')">🗑</span>
        </h2>
        <div id="skills-list"></div>
    </div>

    <div class="section">
        <h2>Experience
            <span class="add-button" onclick="addExperience()">➕</span>
            <span class="delete-button" onclick="removeLast('experience-list')">🗑</span>
        </h2>
        <div id="experience-list"></div>
    </div>

    <div class="section">
        <h2>Certificates
            <span class="add-button" onclick="addCertificate()">➕</span>
            <span class="delete-button" onclick="removeLast('certificates-list')">🗑</span>
        </h2>
        <div id="certificates-list"></div>
    </div>

    <div class="section">
        <h2>Projects
            <span class="add-button" onclick="addProject()">➕</span>
            <span class="delete-button" onclick="removeLast('projects-list')">🗑</span>
        </h2>
        <div id="projects-list"></div>
    </div>

    <div class="section" id="rodo-section-container">
        <h2>
            <span class="add-button" onclick="addRODO()">➕</span>
            <span class="delete-button" onclick="removeLast('rodo-section')">🗑</span>
        </h2>
        <div id="rodo-section"></div>
    </div>
</div>

<div class="buttons-container">
    <button id="toggle-edit" class="done-btn">Finished</button>
    <button id="generate-pdf-btn" class="generate-pdf-btn" onclick="generatePDF(event)" style="display:none;">Generate PDF</button>
</div>

<script>

    async function generatePDF() {
        const container = document.querySelector('.cv-container');
        const originalContainer = container.cloneNode(true);

        const elementsToRemove = originalContainer.querySelectorAll(
            '.add-button, .delete-button, .contact-options, #toggle-edit, #generate-pdf-btn'
        );
        elementsToRemove.forEach(el => el.remove());

        const rodoSection = originalContainer.querySelector('#rodo-section-container');
        if (rodoSection) {
            originalContainer.removeChild(rodoSection);
            originalContainer.appendChild(rodoSection);

            rodoSection.style.marginTop = 'auto';
            rodoSection.style.paddingTop = '20px';
        }

        originalContainer.querySelectorAll('textarea').forEach(textarea => {
            if (textarea.value.trim()) {
                const span = document.createElement('span');
                span.textContent = textarea.value;
                span.style.cssText = window.getComputedStyle(textarea).cssText;
                span.style.fontFamily = "'Old Standard TT', serif";
                span.style.fontSize = textarea.style.fontSize || '14px';
                span.style.fontWeight = 'normal';
                textarea.parentNode.replaceChild(span, textarea);
            } else {
                textarea.style.display = 'none';
            }
        });

        originalContainer.querySelectorAll('input[type="text"], input[type="email"]').forEach(input => {
            const span = document.createElement('span');
            span.textContent = input.value;
            span.style.cssText = input.style.cssText;
            span.style.fontFamily = "'Old Standard TT', serif";
            span.style.fontSize = input.style.fontSize || 'inherit';
            span.style.fontWeight = 'normal';
            input.parentNode.replaceChild(span, input);
        });

        originalContainer.querySelectorAll('div[contenteditable="true"]').forEach(div => {
            const span = document.createElement('span');
            span.textContent = div.textContent;
            span.style.cssText = div.style.cssText;
            span.style.fontFamily = "'Old Standard TT', serif";
            span.style.fontSize = div.style.fontSize || 'inherit';
            span.style.fontWeight = 'normal';
            div.parentNode.replaceChild(span, div);
        });

        const additionalStyles = `
@page {
    size: A4;
    margin: 0;
}
@media print {
    html, body {
        height: 297mm;
        width: 210mm;
        margin: 0;

    }
    .cv-container {
        height: 297mm !important;
        width: 210mm !important;
        margin: 0 !important;
        padding: 1.5rem !important;
        box-shadow: none !important;
        border: none !important;
        page-break-after: avoid;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
    }
    .add-button, .delete-button, .contact-options, #toggle-edit, #generate-pdf-btn {
        display: none !important;
    }
    textarea, input {
        border: none !important;
        background: transparent !important;
    }
}
body {
    font-family: 'Old Standard TT', serif;

    margin: 0;
    padding: 0;
    width: 210mm;
    height: 297mm;

}

    font-family: 'Old Standard TT', serif !important;

}
.cv-container {

    min-height: 29.7cm;

    margin: 1rem auto;

    display: flex;

}

    margin-top: auto;

}
h1 {
    margin-top: 0;

}
.contact-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 1px;

}

    border-bottom: 2px solid #730D3F;
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
    justify-content: center;
    align-items: center;
    margin-bottom: 2px;
    font-size: 0.85rem;
    color: #444;
    margin-top: 1px;
    box-shadow: none;
    width: 100%;
    padding-bottom: 5px;
}

    display: flex;
    align-items: center;

    animation: fadeIn 0.5s ease;

}

    animation: fadeIn 1s ease;

}

    font-size: 1rem;

}
input[type="text"], input[type="email"] {
    font-size: 0.8rem;

}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }

}
@keyframes fadeOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-10px); }
}
.contact-info {
    clear: both;
    display: flex;
    justify-content: space-around;
    align-items: center;
    text-align: center;
    margin-bottom: 1.2rem;

}

    font-size: 0.95rem;
}

    border: none;

    outline: none;

    padding: 0 4px;
}
.bullet-list { list-style: disc; margin-left: 2rem; }
.column-layout { display: flex; gap: 3rem; }
.left, .right { flex: 1; }
.strengths span, .languages span {
    display: inline-block;

}

    border: none;

}
.contact-btn.selected {
    background-color: #730D3F;
    color: white;
}

    margin-top: 0;
    margin-bottom: 0;
}
.section h2 {
    margin-bottom: 1px;
    color: #730D3F;
    font-size: 20px;
}

    display: inline-block;
    background: #eee;

}

}

    margin-bottom: 0;
}

    position: relative;
    list-style-type: none;

        const html = `
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <title>CV</title>
    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
    <style>${additionalStyles}</style>
</head>
<body style="margin: 0; padding: 0;">
    ${originalContainer.outerHTML}
</body>
</html>
`;

        try {
            const response = await fetch('http://localhost:3001/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    html: html,
                    styles: additionalStyles
                })
            });

            if (!response.ok) throw new Error('Server error generating PDF.');

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = 'CV.pdf';
            link.click();

            URL.revokeObjectURL(url);
        } catch (err) {
            alert('Failed to generate PDF: ' + err.message);
            console.error('PDF error:', err);
        }
    }


    function autoGrow(id) {//  ADDED - && typeof field.scrollWidth !== 'undefined'
        const field = document.getElementById(id);
        if (field && typeof field.scrollWidth !== 'undefined') {
            field.style.width = "1px";
            field.style.width = (field.scrollWidth) + "px";
        }
    }
    function createDeleteButton(parent) {
        const btn = document.createElement('span');
        btn.className = 'delete-button';
        btn.textContent = '🗑';
        btn.onclick = () => parent.remove();
        return btn;
    }

    function addExperience() {
        const div = document.createElement("div");
        div.className = "dynamic-entry";
        div.innerHTML = `
        <div style="display: flex; flex-direction: column; justify-content: flex-start;">
            <div style="display: flex; justify-content: space-between;">
                <div style="font-size:17px; font-weight:bold;">
                    <textarea style="border:none; width: 100%; height: 17px; font-size:17px; font-weight:bold; margin-bottom: 0;" placeholder="Position"></textarea>
                </div>
                <div>
                    <textarea style="border:none; width: 100%; height: 17px;" placeholder="Period"></textarea>
                </div>
            </div>
            <div style="margin-top:4px;">
              <textarea style="border:none; width: 100%; height: 15px;font-size:15px;" placeholder="Company"></textarea>
            </div>
        </div>
        <ul>
            <li class="custom-li"><textarea style="width: 100%; height: 34px; border:none;" placeholder="Responsibilities or achievement"></textarea></li>
        </ul>`;
        // ADDED
        const container = document.getElementById("experience-list");
        if (container) container.appendChild(div);

    }

    let selectedContacts = [];

    function addContactField(type) {
        const index = selectedContacts.indexOf(type);

        if (index > -1) {
            removeContactField(type);
            selectedContacts.splice(index, 1);
            // ADDED
            if (document.querySelector) {
                const btn = document.querySelector(`button[onclick="addContactField('${type}')"]`);
                if (btn && btn.classList) {
                    btn.classList.remove('selected');
                }
            }

            return;
        }

        if (selectedContacts.length >= 3) {
            alert("You can only select exactly 3 contact fields.");
            return;
        }
        // ADDED
        const existingField = document.getElementById(`contact-${type}`);
        if (existingField) {
            return;
        }

        const fields = {
            email: { icon: "fas fa-envelope", placeholder: "your.email@gmail.com", inputType: "email", id: "contact-email" },
            phone: { icon: "fas fa-phone", placeholder: "+1 000 000 0000", inputType: "text", id: "contact-phone" },
            address: { icon: "fas fa-home", placeholder: "Address, City, Country", inputType: "text", id: "contact-address" },
            linkedin: { icon: "fab fa-linkedin", placeholder: "linkedin.com/in/yourprofile", inputType: "text", id: "contact-linkedin" },
            github: { icon: "fab fa-github", placeholder: "github.com/yourgithub", inputType: "text", id: "contact-github" }
        };

        if (!fields[type]) return;

        const container = document.getElementById("contact-fields");
        // ADDED
        if (!container) return;
        if (document.getElementById(`contact-${type}`)) return;

        const wrapper = document.createElement("div");
        wrapper.className = "contact-field";
        wrapper.id = `contact-${type}`;

        wrapper.innerHTML = `
        <i class="${fields[type].icon}"></i>
        <input type="${fields[type].inputType}" placeholder="${fields[type].placeholder}" id="${fields[type].id}"
               oninput="autoGrow('${fields[type].id}')" />
    `;

        container.appendChild(wrapper);
        updateIconColor(type);
        selectedContacts.push(type);
        // ADDED
        if (document.querySelector) {
            const btn = document.querySelector(`button[onclick="addContactField('${type}')"]`);
            if (btn && btn.classList) {
                btn.classList.add('selected');
            }
        }
    }

    function updateIconColor(type) {
        let color;

        switch(type) {
            case 'email':
                color = 'blue';
                break;
            case 'phone':
                color = 'green';
                break;
            case 'address':
                color = 'red';
                break;
            case 'linkedin':
                color = '#0077b5'; // LinkedIn blue
                break;
            case 'github':
                color = 'black';
                break;
            default:
                color = 'black';
        }

        let icon = document.querySelector(`.fa-${type}`);
        if(icon) {
            icon.style.color = color;
        }
    }

    function finalizeContactFields() {
        if (selectedContacts.length < 3 || selectedContacts.length > 3) {
            alert("Please select exactly 3 contact fields.");
            return;
        }

        const container = document.getElementById("contact-fields");
        if (!container) return;

        const fields = container.querySelectorAll(".contact-field");
        let hasEmptyFields = false;
        let emptyFieldTypes = [];

        fields.forEach(field => {
            const input = field.querySelector("input");
            if (input) {
                const value = input.value.trim();
                if (value === '') {
                    hasEmptyFields = true;
                    const fieldType = field.id.replace('contact-', '');
                    emptyFieldTypes.push(fieldType);
                }
            }
        });

        if (hasEmptyFields) {
            const fieldNames = emptyFieldTypes.map(type => {
                switch(type) {
                    case 'email': return 'Email';
                    case 'phone': return 'Phone';
                    case 'address': return 'Address';
                    case 'linkedin': return 'LinkedIn';
                    case 'github': return 'GitHub';
                    default: return type;
                }
            }).join(', ');

            alert(`Please fill in all contact fields. Empty fields: ${fieldNames}`);
            return;
        }

        fields.forEach(field => {
            const input = field.querySelector("input");
            const icon = field.querySelector("i");

            if (input && icon) {
                const value = input.value.trim();
                const fieldId = field.id; // Preserve the original ID

                field.innerHTML = '';

                const newIcon = document.createElement("i");
                newIcon.className = icon.className;

                const span = document.createElement("span");
                span.textContent = value;
                span.style.marginLeft = "5px";

                field.appendChild(newIcon);
                field.appendChild(span);
                field.id = fieldId; // Restore the field ID after innerHTML clearing
            }
        });

        const options = document.getElementById("contact-options");
        if (options) {
            options.style.animation = "fadeOut 0.5s ease";
            setTimeout(() => {
                if (options.parentNode) {
                    options.style.display = "none";
                }
            }, 500);
        }
    }


    function removeContactField(type) {
        const field = document.getElementById(`contact-${type}`);
        if (field) field.remove();
    }

    function createDeleteButton(parent) {

        btn.className = 'delete-button';

    function updateStyle(el) {
        const text = el.innerText;
        const match = text.match(/^([^:]+:)(.*)$/);

        if (match) {
            const boldPart = match[1].trim();
            const normalPart = match[2];
            el.innerHTML = `<strong style="font-weight: 5000; font-size: 120%;">${boldPart}</strong>${normalPart}`;
            placeCaretAtEnd(el);
        }
    }


    function placeCaretAtEnd(el) {
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(el);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
    }

    function removeLast(listId) {
        const list = document.getElementById(listId);
        if (list && list.childElementCount > 1) {
            list.removeChild(list.lastElementChild);
        }

    function hideEditButtons() {
        const addButtonEls = document.querySelectorAll(".add-button");
        const deleteButtonEls = document.querySelectorAll(".delete-button");

        addButtonEls.forEach(el => el.style.display = 'none');
        deleteButtonEls.forEach(el => el.style.display = 'none');
    }


    document.getElementById('toggle-edit').addEventListener('click', function() {
        const addButtonEls = document.querySelectorAll(".add-button");
        const deleteButtonEls = document.querySelectorAll(".delete-button");
        const textAreaEls = document.querySelectorAll("textarea");
        const generatePDFButton = document.getElementById('generate-pdf-btn');
        const inputEls = document.querySelectorAll("input"); // DODANE
        const editableEls = document.querySelectorAll("div[contenteditable]"); // DODANE

        if (this.innerText === "Finished") {
            addButtonEls.forEach(el => el.style.display = 'none');
            deleteButtonEls.forEach(el => el.style.display = 'none');

            textAreaEls.forEach(el => {
                el.style.border = 'none';
                el.style.resize = 'none';
                el.readOnly = true; // DODANE
            });

            inputEls.forEach(el => el.readOnly = true); // DODANE
            editableEls.forEach(el => el.contentEditable = "false"); // DODANE
            generatePDFButton.style.display = 'inline-block';

            this.innerText = "Edit";
        } else {
            addButtonEls.forEach(el => el.style.display = 'inline-block');
            deleteButtonEls.forEach(el => el.style.display = 'inline-block');
            textAreaEls.forEach(el => {
                el.style.border = '1px solid #ccc';
                el.style.resize = 'both';
                el.readOnly = false; // DODANE
            });
            inputEls.forEach(el => el.readOnly = false); // DODANE
            editableEls.forEach(el => el.contentEditable = "true"); // DODANE

            generatePDFButton.style.display = 'none';

            this.innerText = "Finished";
        }
    });

    window.onload = () => {
